name: Update Track Conditions

# 実行するタイミング（トリガー）の設定
on:
  schedule:
    # 毎日 UTC 09:00 (日本時間 18:00) に実行
    - cron: '0 9 * * *'
  workflow_dispatch:

# [修正] GITHUB_TOKEN に書き込み権限を明示（リポジトリ設定が読み取り専用だと git push が exit code 128 で失敗するため） (v.2026.9.19+26091902)
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 1. リポジトリのコードをチェックアウト（取得）する
      # [修正] Node.js 20 廃止警告への対応で v5 に更新 (v.2026.9.19+26091902)
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. 実行環境のセットアップ
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1

      # ★ここを追加・修正★
      - name: Install Dependencies
        run: dart pub get

      - name: Run Scraping Script
        run: dart run scraper.dart

      # 4. 変更があった場合のみ、自動でコミット＆プッシュして version.json をインクリメントする
      - name: Commit and Push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add track_conditions.csv track_conditions.json version.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update track conditions" && git push)
